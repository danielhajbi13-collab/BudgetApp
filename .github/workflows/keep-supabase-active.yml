name: Keep Supabase Active

# Free Supabase projects are paused after ~7 days without activity.
# This pings EVERY project of ours twice a day with a real database query.
# A failed run makes GitHub email the repo owner, so a paused project, a
# missing key or a disabled schedule is noticed within hours, not weeks.
#
# Adding a new Supabase project = add one entry under `matrix.include`
# and one repository secret holding that project's anon/publishable key.

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keep-alive:
    name: ping ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # key_secret: repository secret with the anon key (optional).
          # site: public site whose JS bundle already ships the anon key;
          #       used when the secret is not set, so no secret is needed.
          - name: BudgetApp
            ref: lktciczanxnrdydwybez
            table: month_data
            key_secret: SUPABASE_PUBLISHABLE_KEY
            site: https://danielhajbi13-collab.github.io/BudgetApp/
          # MyTeam (eenegwvjswdokuapmvmk, table businesses) is paused on
          # purpose: the free plan allows only 2 active projects per account
          # (BudgetApp + Sderot). Re-add it here if it becomes active again.
          - name: batei-knesset-sderot
            ref: taaoypchtowbnwzftqhy
            table: synagogues
            key_secret: SDEROT_SUPABASE_KEY
            site: https://batei-knesset-sderot.vercel.app/
    steps:
      - name: Query ${{ matrix.name }} database
        env:
          REF: ${{ matrix.ref }}
          TABLE: ${{ matrix.table }}
          SITE: ${{ matrix.site }}
          KEY: ${{ secrets[matrix.key_secret] }}
          KEY_SECRET: ${{ matrix.key_secret }}
        run: |
          set -uo pipefail
          HOST="${REF}.supabase.co"
          DASH="https://supabase.com/dashboard/project/${REF}"

          # 1. A paused project disappears from DNS. This needs no key,
          #    so it is checked for every project, always.
          if ! getent hosts "${HOST}" > /dev/null; then
            echo "::error::${HOST} does not resolve - the project is PAUSED. Restore it now: ${DASH}"
            exit 1
          fi

          # 2. Find the public anon key: secret first, else the live site.
          if [ -z "${KEY}" ] && [ -n "${SITE}" ]; then
            for f in "${SITE}" $(curl -sL --max-time 20 "${SITE}" \
                | grep -oE '(src|href)="[^"]+\.js"' | sed -E 's/^(src|href)="//; s/"$//'); do
              case "$f" in http*) url="$f" ;; /*) url="${SITE%/}${f}" ;; *) url="${SITE%/}/${f}" ;; esac
              KEY=$(curl -sL --max-time 20 "$url" \
                | grep -oE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' \
                | head -1 || true)
              [ -n "${KEY}" ] && break
            done
          fi
          if [ -z "${KEY}" ]; then
            echo "::warning::${HOST} is up, but no key to query it (set secret ${KEY_SECRET} for a full check)."
            exit 0
          fi
          echo "::add-mask::${KEY}"

          code=$(curl --silent --show-error --output /tmp/body \
            --write-out '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            -H "Accept: application/json" \
            "https://${HOST}/rest/v1/${TABLE}?select=*&limit=1") || code=000

          if [ "${code}" != "200" ]; then
            echo "::error::${HOST} answered HTTP ${code} (paused, restoring, or wrong key). Check: ${DASH}"
            head -c 300 /tmp/body 2>/dev/null || true
            exit 1
          fi
          echo "${HOST}: database query OK."

  # GitHub silently disables scheduled workflows after 60 days without
  # commits. Re-enabling it on every run resets that timer.
  stay-enabled:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/keep-supabase-active.yml/enable"
          echo "Schedule stays enabled."
